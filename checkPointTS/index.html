<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Mirador · Gestión de reservas</title>
  <link rel="stylesheet" href="src/css/style.css">
  <script type="module" src="js/main.js"></script>

</head>
<body>
  <header>
    <div class="contenedor">
      <h1>Hotel Mirador</h1>
      <p>Panel de gestión de reservas</p>
    </div>
  </header>

  <main class="contenedor">
    <section class="rejilla">
      <article class="tarjeta">
        <h2>Total facturado</h2>
        <p class="cifra" id="total-facturado">—</p>
        <p class="nota">Reservas confirmadas y finalizadas</p>
      </article>

      <article class="tarjeta">
        <h2>Ocupación por tipo</h2>
        <ul id="ocupacion">
          <li><span>Sin datos</span><strong>—</strong></li>
        </ul>
        <p class="nota">Reservas confirmadas</p>
      </article>

      <article class="tarjeta">
        <h2>Consultar reserva</h2>
        <form id="form-consulta" autocomplete="off">
          <input id="input-id" type="text" placeholder="Id de la reserva" aria-label="Id de la reserva">
          <button id="buscar" type="submit">Buscar</button>
        </form>
        <p class="resultado" id="resultado-consulta" aria-live="polite"></p>
      </article>
    </section>

    <section class="tarjeta">
      <h2>Reservas</h2>
      <div class="tabla-envoltorio">
        <table>
          <thead>
            <tr>
              <th>Id</th>
              <th>Huésped</th>
              <th>Habitación</th>
              <th>Entrada</th>
              <th>Noches</th>
              <th>Estado</th>
              <th class="num">Importe</th>
            </tr>
          </thead>
          <tbody id="tabla-reservas">
            <tr><td>1</td><td>Adela Nail</td><td>100</td><td>28/10/2026</td><td>3</td><td>Confirmada</td><td class="num">240 €</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
